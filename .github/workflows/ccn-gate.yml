name: CCN Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ccn:
    name: Complexity (CCN<=10, changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analyzer
        run: python -m pip install lizard==1.24.0
      - name: Check committed snapshot
        run: python scripts/ccn_gate.py --base origin/main
