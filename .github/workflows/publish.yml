name: Publish to PyPI

on:
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate release tag and package version
        run: python scripts/validate_release.py --tag "$GITHUB_REF_NAME"

      - name: Verify release commit is on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Test
        run: pytest

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbnt-dist
          path: dist/

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    # This must match the "Environment name" configured on the PyPI trusted
    # publisher for this project. See the ONE-TIME setup note in README.md /
    # CONTRIBUTING.md before the first tagged release.
    environment: pypi
    permissions:
      id-token: write # required for OIDC trusted publishing — no API token needed
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: dbnt-dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
